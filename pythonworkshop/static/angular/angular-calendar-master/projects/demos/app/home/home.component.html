<mat-toolbar class="mat-elevation-z8"
  *ngIf="(tokenStorage.authenticated$ | async) ===true; else loggedOutToolbarTempl">
  <button
    mat-icon-button
    *ngIf="sidenav?.mode === 'over'"
    (click)="sidenav?.toggle()"
  >
    <mat-icon *ngIf="!sidenav.opened">menu</mat-icon>
    <mat-icon *ngIf="sidenav.opened">close</mat-icon>
  </button> 
  {{'ToolbarTitle' | translate}}
  <span class="left-spacer"></span>
  <flag [code]="translate.currentLang ? translate.currentLang : translate.getDefaultLang()" 
          [size]="'md'"  [effect]="'app'" style="margin-right: 0.5em;"></flag>
    <mat-select class="lang-select"
        [value]="translate.currentLang ? translate.currentLang : translate.getDefaultLang()"
        #selectedLang 
        (selectionChange)="switchLang(selectedLang.value)">
      <mat-option *ngFor="let language of translate.getLangs()" 
        [value]="language">
        {{ (language==='gb' ? 'en' : language) }}
      </mat-option>
    </mat-select>
</mat-toolbar>

<ng-template #loggedOutToolbarTempl>
  
    <mat-toolbar class="mat-elevation-z8">
      <ng-container *ngIf="isDesktop; then wideToolbar else shrinkToolbar"></ng-container>
      <ng-template #shrinkToolbar>
        <button
          mat-icon-button
          *ngIf="sidenav?.mode === 'over'"
          (click)="sidenav?.toggle()"
        >
        <mat-icon *ngIf="!sidenav.opened">menu</mat-icon>
        <mat-icon *ngIf="sidenav.opened">close</mat-icon>
        </button>  
        <!-- <ng-container *ngIf="isDesktop">
            <button mat-button class="menu-button" routerLink="/bb/hjem">Byklebreiband</button>

            </mat-menu>
        </ng-container> -->
      
    </ng-template>
    <ng-template #wideToolbar>
        <button mat-button class="toolbar-button" routerLink="/landing">Hjem</button>
        <button mat-button class="toolbar-button" routerLink="/bb/contact">Kontakt</button>
        <button mat-button class="toolbar-button" routerLink="/salgsbetingelser">Salgsbetingelser</button>
        <button mat-button class="toolbar-button float-end" routerLink="/register">
          <mat-icon>app_registration</mat-icon>
          <span>{{'ToolbarRegister' | translate}}</span>
        </button>
    </ng-template>

    <span class="left-spacer"></span>
    <button mat-button class="toolbar-button link link.dark-blue-gradient-bg float-end" routerLink="/login">
      <mat-icon>login</mat-icon>
      <span>{{'ToolbarLogin' | translate}}</span>
    </button>
    
    <flag class="float-end"   [code]="translate.currentLang ? translate.currentLang : translate.getDefaultLang()" 
          [size]="'md'"  [effect]="'app'" style="margin-right: 0.5em;"></flag>
    <mat-select class="lang-select float-end"
        [value]="translate.currentLang ? translate.currentLang : translate.getDefaultLang()"
        #selectedLang 
        (selectionChange)="switchLang(selectedLang.value)">
      <mat-option *ngFor="let language of translate.getLangs()" 
        [value]="language">
        {{ language==='gb' ? 'en' : language }}
      </mat-option>
    </mat-select>
    </mat-toolbar>
  
  
</ng-template>
<mat-sidenav-container>
    <mat-sidenav  #sidenav="matSidenav" class="mat-elevation-z8">
      <ng-container 
      *ngIf="( tokenStorage.combAuthProtected$ | async) === true; then loggedInSidenav  else loggedOutSidenav"></ng-container>
      <ng-template #loggedOutSidenav>
        <button mat-button class="menu-button" routerLink="/landing">
          <mat-icon>home</mat-icon>
          <span>{{ 'ToolbarHome' | translate }}</span>
        </button>
        <button mat-button class="menu-button" routerLink="/bb/contact">
          <mat-icon>contact</mat-icon>
          <span>{{ 'ToolbarContact' | translate }}</span></button>
        <button mat-button class="menu-button" routerLink="/salgsbetingelser">
          <mat-icon>policy</mat-icon>
          <span>{{ 'ToolbarPolicy' | translate }}</span>
        </button>
        <button mat-button class="menu button" routerLink="/register">
          <mat-icon>app_registration</mat-icon>
          <span>{{'ToolbarRegister' | translate}}</span>
        </button>
      </ng-template>
      
      <ng-template #loggedInSidenav>
        <mat-chip-listbox class="mat-mdc-chip-set-stacked" aria-label="Color selection">
          <mat-chip-option *ngFor="let chip of availableColors" selected [color]="chip.color">
            {{chip.name}} 
          </mat-chip-option>
        </mat-chip-listbox>
        <img
        class="avatar mat-elevation-z8"
        src="assets/ufo.jpg"
        />
          <h4 class="name">{{tokenStorage.getUser().user_email}}</h4>
          <p class="designation">{{tokenStorage.getUser().is_admin ? "admin" : "user"}}</p>
          <mat-divider></mat-divider>
          <mat-nav-list dense>
            <ng-container *ngIf="!tokenStorage.getUser().is_admin; then userCalendarView else adminCalendarView">
            </ng-container>
            <ng-template #userCalendarView>
              <mat-expansion-panel [class.mat-elevation-z0]="true">
                <mat-expansion-panel-header [style.padding-left]="0">
                  <button mat-button class="menu-button" routerLink="/calendar">
                    <mat-icon>calendar_month</mat-icon>
                    <span>{{'SideNavCalendar' | translate}}</span>
                  </button>
                </mat-expansion-panel-header>
                <mat-nav-list dense>
                  <mat-list-item [style.padding-left]="0" [style.padding-right]="0" (click)="editOuEvents()">
                    <button   mat-button class="menu-button" >
                      <mat-icon>edit_calendar</mat-icon>
                      <span>{{'SideNavEditEvents' | translate}}</span>
                    </button>
                  </mat-list-item>
                </mat-nav-list>
              </mat-expansion-panel>
            </ng-template>    
            <ng-template #adminCalendarView>
              <mat-expansion-panel [class.mat-elevation-z0]="true">
                <mat-expansion-panel-header [style.padding-left]="0">
                  <button mat-button class="menu-button" routerLink="/calendar">
                    <mat-icon>calendar_month</mat-icon>
                    <span>{{'SideNavCalendar' | translate}}</span>
                  </button>
                </mat-expansion-panel-header>
                <mat-nav-list dense>
                    <mat-list-item [style.padding-left]="0" [style.padding-right]="0" (click)="editEvents()">
                      <button   mat-button class="menu-button" >
                        <mat-icon>edit_calendar</mat-icon>
                        <span>{{'SideNavEditEvents' | translate}}</span>
                      </button>
                    </mat-list-item>
                    <mat-list-item [style.padding-left]="0" [style.padding-right]="0" (click)="editRooms()">
                      <button mat-button class="menu-button" >
                        <mat-icon>tune</mat-icon>
                        <span>{{'SideNavEditRooms' | translate}}</span>
                      </button>
                    </mat-list-item>
                </mat-nav-list> 
              </mat-expansion-panel>

              <mat-list-item [style.padding-left]="0" routerLink="/board_admin">
                <button mat-button class="menu-button">
                  <mat-icon>group</mat-icon>
                  <span>{{'SideNavLDAPprof' | translate}}</span>
                </button>
              </mat-list-item>
            </ng-template>          
          </mat-nav-list>

          <button mat-button class="menu-button" routerLink="/profile">
            <mat-icon>account_box</mat-icon>
            <span>{{'SideNavProfile' | translate}}</span>
          </button>
          <mat-divider></mat-divider>
          <button mat-button class="menu-button" (click)="logout()">
            <mat-icon>logout</mat-icon>
            <span>{{'SideNavLogout' | translate}}</span>
          </button>
      </ng-template>
      

    </mat-sidenav>

  <mat-sidenav-content>
    <div class="content mat-elevation-z8">
      <router-outlet></router-outlet>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
