<table mat-table [dataSource]="dataSourceEx" class="mat-elevation-z8">
    <!-- Position Column -->
    <ng-container matColumnDef="user_email">
        <th mat-header-cell *matHeaderCellDef>  User email </th>
        <td mat-cell *matCellDef="let element"> {{element.user_email}} </td>
      </ng-container>

      <ng-container matColumnDef="address">
        <th mat-header-cell *matHeaderCellDef>  User address </th>
        <td mat-cell *matCellDef="let element"> {{element.address}} </td>
      </ng-container>
    
      <!-- Name Column -->
      <ng-container matColumnDef="ou">
        <th mat-header-cell *matHeaderCellDef>  Org. unit </th>
        <td mat-cell *matCellDef="let element"> {{ element.ou}} </td>
      </ng-container>

      <ng-container matColumnDef="is_logged_in">
        <th mat-header-cell *matHeaderCellDef>  Has logged in </th>
        <td mat-cell *matCellDef="let element"> {{ element.user_is_logged_in}} </td>
      </ng-container>

      <ng-container matColumnDef="last_seen">
        <th mat-header-cell *matHeaderCellDef>  Last seen </th>
        <td mat-cell *matCellDef="let element"> {{ element.last_seen | date:'shortDate'}} </td>
      </ng-container>
    
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    
      <!-- Row shown when there is no matching data. -->
      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell" colspan="4">No data matching the selection </td>
      </tr>
</table>
